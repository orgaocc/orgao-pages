<!DOCTYPE html>

<title>Abrindo o WhatsApp - Grupo Conceber</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f5efe6">
<link rel="icon" href="https://grupoconceber.com/wp-content/uploads/2024/12/cropped-icon_conceber-32x32.png" sizes="32x32">

<!-- onePixel do Grupo Conceber (Meta, GA4, Google Ads, Clarity e VK): registra a visita com as UTMs do link -->
<script src="https://px.grupoconceber.com/_px/t/pk_grupoconceber_d874174c9cdc.js" async></script>

<!--
  /wpp/ = link rastreável pro WhatsApp do comercial (pedido do Luan, 18/11/2026).
  Monta o link no gerador de UTM (luansantos.com.br/orgao/gerador-utm) com esta página como destino.
  A página: registra a visita (onePixel), dispara o evento Contact, e abre o WhatsApp com a mensagem pronta.
  19/11 (pedido da Bruna): saiu o "(origem: fonte · meio · campanha)" do fim da mensagem, que quebrava a conversa
  e muita lead apagava. A origem agora vai na própria frase ("Vim do grupo da Black Friday..."): o Unnichat
  manda a mensagem pro n8n, que acha a frase na lista do gerador e põe a tag (orgao-cc/links-whatsapp).
  ?msg=texto = a mensagem escolhida no gerador. Sem ?msg=, vale a frase do canal (FRASES abaixo, iguais às
  sugestões do gerador), pra os links antigos também ganharem tag.
-->
<script>
window.WPP = {
  numero: '553182343964',            // +55 31 8234-3964, comercial
  mensagem: 'Olá! Quero saber mais sobre o Programa Conceber.', // quando o link não diz o canal
  espera_ms: 1200                    // tempo máximo esperando o pixel antes de abrir o WhatsApp
};
// frase por canal (utm_source/utm_medium). Mesmas do gerador de UTM: mudou aqui, muda lá.
window.WPP_FRASES = {
  'sendflow/grupo': 'Olá! Vim do grupo do Conceber e quero saber mais sobre o Programa Conceber.',
  'sendflow/grupo/black': 'Olá! Vim do grupo da Black Friday e quero saber mais sobre o Programa Conceber.',
  'instagram/stories': 'Olá! Vi nos stories e quero saber mais sobre o Programa Conceber.',
  'instagram/bio': 'Olá! Vim pelo link da bio e quero saber mais sobre o Programa Conceber.',
  'instagram/post': 'Olá! Vi um post no Instagram e quero saber mais sobre o Programa Conceber.',
  'instagram/reels': 'Olá! Vi um post no Instagram e quero saber mais sobre o Programa Conceber.',
  'instagram/direct': 'Olá! Vim pelo direct do Instagram e quero saber mais sobre o Programa Conceber.',
  'manychat/direct': 'Olá! Vim pelo direct do Instagram e quero saber mais sobre o Programa Conceber.',
  'unnichat/whatsapp': 'Olá! Recebi a mensagem de vocês e quero saber mais sobre o Programa Conceber.',
  'mautic/email': 'Olá! Recebi o e-mail de vocês e quero saber mais sobre o Programa Conceber.',
  'youtube/video': 'Olá! Vi o vídeo no YouTube e quero saber mais sobre o Programa Conceber.',
  'parceiro/indicacao': 'Olá! Vim por indicação e quero saber mais sobre o Programa Conceber.',
  'facebookads': 'Olá! Vi o anúncio e quero saber mais sobre o Programa Conceber.'
};
</script>
<style>
:root { --fundo: #f5efe6; --tinta: #2b2b2b; --suave: #6b6359; --verde: #1fa855; --verde-escuro: #178a45; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--fundo); color: var(--tinta);
  font: 400 16px/24px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  display: grid; place-items: center; padding: 24px;
}
.wpp { text-align: center; display: grid; justify-items: center; gap: 16px; max-width: 360px; }
.wpp-icone { width: 64px; height: 64px; border-radius: 50%; background: var(--verde); display: grid; place-items: center; animation: pulso 1.6s ease-out infinite; }
.wpp-icone svg { width: 32px; height: 32px; fill: #fff; }
@keyframes pulso { 0% { box-shadow: 0 0 0 0 rgba(31, 168, 85, .45); } 100% { box-shadow: 0 0 0 16px rgba(31, 168, 85, 0); } }
h1 { margin: 8px 0 0; font-size: 22px; line-height: 32px; font-weight: 600; }
p { margin: 0; color: var(--suave); }
.wpp-btn {
  display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; padding: 12px 24px; border-radius: 999px;
  background: var(--verde); color: #fff; font-weight: 600; text-decoration: none;
}
.wpp-btn:hover { background: var(--verde-escuro); }
@media (prefers-reduced-motion: reduce) { .wpp-icone { animation: none; } }
</style>
</head>
<body>
<main class="wpp">
  <span class="wpp-icone" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/></svg></span>
  <h1>Abrindo o WhatsApp...</h1>
  <p>Se não abrir sozinho, toque no botão.</p>
  <a class="wpp-btn" id="wpp-link" href="https://wa.me/553182343964">Abrir o WhatsApp</a>
</main>

<script>
(function () {
  var cfg = window.WPP;
  var p = new URLSearchParams(location.search);

  // a mensagem: a do link (?msg=) ou a frase do canal; sem "(origem: ...)" no fim
  function frase() {
    var F = window.WPP_FRASES || {};
    var s = (p.get('utm_source') || '').trim().toLowerCase();
    var m = (p.get('utm_medium') || '').trim().toLowerCase();
    var c = (p.get('utm_campaign') || '').trim().toLowerCase();
    if (/^\{\{.*\}\}$/.test(m)) m = '';
    if (/black/.test(c) && F[s + '/' + m + '/black']) return F[s + '/' + m + '/black'];
    return F[s + '/' + m] || F[s] || cfg.mensagem;
  }
  var texto = (p.get('msg') || frase()).trim();

  var destino = 'https://wa.me/' + cfg.numero + '?text=' + encodeURIComponent(texto);
  document.getElementById('wpp-link').href = destino;

  var foi = false;
  function abrir() {
    if (foi) return;
    foi = true;
    try { if (typeof window.fbq === 'function') window.fbq('track', 'Contact'); } catch (e) {}
    // um respiro pro evento sair antes de trocar de página
    setTimeout(function () { location.replace(destino); }, 300);
  }

  // espera o onePixel carregar (até cfg.espera_ms) pra registrar a visita e o Contact com as UTMs
  var inicio = Date.now();
  (function esperar() {
    if (typeof window.fbq === 'function' || Date.now() - inicio > cfg.espera_ms) return abrir();
    setTimeout(esperar, 100);
  })();
})();
</script>
</body>
</html>
