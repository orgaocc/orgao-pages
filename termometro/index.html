<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Termômetro da Intoxicação - Grupo Conceber</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f7f6ef">
<link rel="icon" href="https://grupoconceber.com/wp-content/uploads/2024/12/cropped-icon_conceber-32x32.png" sizes="32x32">

<!-- onePixel do Grupo Conceber (Meta, GA4, Google Ads, Clarity e VK): registra a visita com as UTMs do link -->
<script src="https://px.grupoconceber.com/_px/t/pk_grupoconceber_d874174c9cdc.js" async></script>

<!--
  /termometro/ = link fixo do Termômetro da Intoxicação, o presente do webinar (vai no chat do EverWebinar aos 1:09:35).
  Pedido da Bruna e da Elisa (19/11/2026): um link que já entra no webinar e é redirecionado depois.
  Quando o termômetro ficar pronto, é só pôr o endereço em "destino" abaixo e publicar. As UTMs do link seguem junto.
-->
<script>
window.TERMOMETRO = {
  destino: '',      // [a preencher] link do termômetro que a Elisa está montando
  espera_ms: 1000   // tempo máximo esperando o pixel antes de redirecionar
};
</script>
<style>
:root { --fundo: #f7f6ef; --tinta: #262a1f; --suave: #5a6050; --cor: #74815a; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--fundo); color: var(--tinta);
  font: 400 16px/24px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  display: grid; place-items: center; padding: 24px;
}
.t { text-align: center; display: grid; justify-items: center; gap: 16px; max-width: 360px; }
.t-anel { width: 48px; height: 48px; border-radius: 50%; border: 4px solid #dfe5cf; border-top-color: var(--cor); animation: gira 1s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
h1 { margin: 8px 0 0; font-size: 22px; line-height: 32px; font-weight: 600; }
p { margin: 0; color: var(--suave); }
@media (prefers-reduced-motion: reduce) { .t-anel { animation: none; } }
</style>
</head>
<body>
<main class="t">
  <span class="t-anel" aria-hidden="true"></span>
  <h1 id="t-titulo">Abrindo o Termômetro da Intoxicação...</h1>
  <p id="t-texto"></p>
</main>

<script>
(function () {
  var cfg = window.TERMOMETRO || {};
  if (!cfg.destino) {
    /* ainda sem destino: não deixa a pessoa num carregando sem fim */
    document.querySelector('.t-anel').style.display = 'none';
    document.getElementById('t-titulo').textContent = 'O Termômetro da Intoxicação ainda não está disponível.';
    document.getElementById('t-texto').textContent = 'Volte por este mesmo link daqui a pouco.';
    return;
  }
  var url = new URL(cfg.destino);
  new URLSearchParams(location.search).forEach(function (v, k) { if (!url.searchParams.has(k)) url.searchParams.set(k, v); });
  var foi = false;
  function ir() { if (foi) return; foi = true; location.replace(url.toString()); }
  var inicio = Date.now();
  (function esperar() {
    if (typeof window.fbq === 'function' || Date.now() - inicio > (cfg.espera_ms || 1000)) return setTimeout(ir, 150);
    setTimeout(esperar, 100);
  })();
})();
</script>
</body>
</html>
